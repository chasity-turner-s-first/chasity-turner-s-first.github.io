<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it">
                <h1>Create.</h1>
                <p>Make something worth Remembering</p>
            </div>

            <div class="post-it violetblue">
                <h2>Remember</h2>
                <p>Progress over perfection</p>
            </div>
            <div class="post-it">
                <h2>Inspiration</h2>
                <p>Collect ideas. Follow curiosity.</p>
            </div>
            <br>
            <div class="post-it violetblue">
                <h2>To Do</h2>
                <ul>
                    <li>Finnish Project</li>
                    <li>Practice CSS</li>
                    <li>Build Portfolio</li>
                </ul>
            </div>
            <div class="post-it polaroid">
                <img 
                    src="images/artwork.jpg" 
                    alt="Swirls of blue and greys"
                >
                <p>fun artwork</p>
            </div>
            <div class="post-it violetblue">
                <h2>NOTE TO SELF</h2>
                <p>You dont have to figure it all out today.</p>
            </div>

        </div>
    </body>
</html>

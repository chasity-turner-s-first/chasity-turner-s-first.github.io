<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calendar Widget</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="calendar"> 
            <h5 class="day"> Friday </h5>
            <p class="date"> 26 </p>
            <div class="event work"> 
                <h5 class="event-name"> Client Meeting</h5>
                <h4 class="event-type"> Work </h4>
                <p class="time"> 10:15 AM - 11:30 AM </p>
            </div>
            <div class="event personal"> 
                <h5 class="event-name"> Hangout with Fri..</h5>
                <h4 class="event-type"> Personal</h4>
                <p class="time"> 4:00pm - 6:00pm </p>
            </div>
        </div>
        <div class="calendar"> 
            <h5 class="day"> Saturday </h5>
            <p class="date"> 27 </p>
            <div class="event personal"> 
                <h5 class="event-name"> Football Game..</h5>
                <h4 class="event-type"> Personal </h4>
                <p class="time"> 9:15 AM - 12:00pm </p>
            </div>
            <div class="event personal"> 
                <h5 class="event-name"> Cookout </h5>
                <h4 class="event-type"> Personal </h4>
                <p class="time"> 12:00pm - 6:00pm </p>
            </div>
        </div>
    </body>
    <div class="calendar"> 
            <h5 class="day"> Sunday </h5>
            <p class="date"> 28 </p>
            <div class="event personal"> 
                <h5 class="event-name"> Visit Na..</h5>
                <h4 class="event-type"> Personal </h4>
                <p class="time"> 10:00 AM - 2:00pm </p>
            </div>
            <div class="event work"> 
                <h5 class="event-name"> CSS Code Project </h5>
                <h4 class="event-type"> Work </h4>
                <p class="time"> 3:00pm - 5:00pm </p>
            </div>
        </div>
</html>
